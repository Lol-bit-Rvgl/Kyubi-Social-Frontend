name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Seleccionar Xcode 16 (Soporte iOS 18 SDK)
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer
          xcodebuild -version

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Desactivar Swift Package Manager en Flutter
        run: |
          flutter config --no-enable-swift-package-manager

      - name: Instalar dependencias Flutter
        run: flutter pub get

      - name: Generar configuracion de Flutter para iOS sin firma
        run: |
          flutter build ios --config-only --no-codesign

      - name: Instalar CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Compilar Release para iOS (no-codesign)
        run: |
          flutter build ios --release --no-codesign --dart-define=KYUBI_CLIENT_SIGN_SECRET=kyubi-hjtrfs-client-sign-v1

      - name: Empaquetar como archivo .IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r Kyubi.ipa Payload
          mkdir -p build/output
          mv Kyubi.ipa build/output/

      - name: Subir IPA como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: Kyubi-iOS-IPA
          path: build/output/Kyubi.ipa
